  <foreignObject x="92" y="510" width="1416" height="1570"><div xmlns="http://www.w3.org/1999/xhtml" style="display:grid;grid-template-columns:repeat(3,1fr);gap:24px;font-family:Arial,sans-serif;"><div class="card"><div class="num">01</div><div class="mini"><div class="frame"></div><div class="arrow">→</div></div><h3>American shot + Tracking</h3><p class="emotion">Personaje en acción</p><p class="use">Caminata determinada, llegada, salida</p></div><div class="card"><div class="num">02</div><div class="mini"><div class="frame"></div><div class="arrow">↻</div></div><h3>American + Front steadicam</h3><p class="emotion">Urgencia controlada</p><p class="use">Persecución, búsqueda, decisión en marcha</p></div><div class="card"><div class="num">03</div><div class="mini"><div class="frame"></div><div class="arrow">⚡</div></div><h3>Medium + Lateral tracking</h3><p class="emotion">Walk and talk dinámico</p><p class="use">Diálogo en movimiento</p></div><div class="card"><div class="num">04</div><div class="mini"><div class="frame"></div><div class="arrow">→</div></div><h3>POV + Tracking</h3><p class="emotion">Inmersión total</p><p class="use">Llegar por primera vez, descubrir</p></div><div class="card"><div class="num">05</div><div class="mini"><div class="frame"></div><div class="arrow">↻</div></div><h3>POV + Handheld</h3><p class="emotion">Realismo brutal</p><p class="use">Acción, miedo, persecución</p></div><div class="card"><div class="num">06</div><div class="mini"><div class="frame"></div><div class="arrow">⚡</div></div><h3>Dutch angle + Dolly in</h3><p class="emotion">Locura creciente</p><p class="use">Paranoia, pérdida de control mental</p></div><div class="card"><div class="num">07</div><div class="mini"><div class="frame"></div><div class="arrow">→</div></div><h3>Close-up + Crash zoom</h3><p class="emotion">Shock psicológico</p><p class="use">Revelación traumática</p></div><div class="card"><div class="num">08</div><div class="mini"><div class="frame"></div><div class="arrow">↻</div></div><h3>Extreme close-up + Crash</h3><p class="emotion">Pista clave explosiva</p><p class="use">Objeto que cambia la escena</p></div><div class="card"><div class="num">09</div><div class="mini"><div class="frame"></div><div class="arrow">⚡</div></div><h3>Over shoulder + Push in</h3><p class="emotion">Complicidad y espionaje</p><p class="use">Vigilancia, conversación tensa</p></div></div></foreignObject>
