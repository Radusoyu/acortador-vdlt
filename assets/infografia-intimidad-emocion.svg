  <foreignObject x="92" y="510" width="1416" height="1570"><div xmlns="http://www.w3.org/1999/xhtml" style="display:grid;grid-template-columns:repeat(3,1fr);gap:24px;font-family:Arial,sans-serif;"><div class="card"><div class="num">01</div><div class="mini"><div class="frame"></div><div class="arrow">→</div></div><h3>Close-up + Dolly in</h3><p class="emotion">Intimidad creciente</p><p class="use">Confesión, decisión interna, declaración de amor</p></div><div class="card"><div class="num">02</div><div class="mini"><div class="frame"></div><div class="arrow">↻</div></div><h3>Close-up + Push in lento</h3><p class="emotion">Tensión psicológica</p><p class="use">Antes de quebrarse, revelación silenciosa</p></div><div class="card"><div class="num">03</div><div class="mini"><div class="frame"></div><div class="arrow">⚡</div></div><h3>Close-up + Static shot</h3><p class="emotion">Lectura emocional pura</p><p class="use">Diálogo cara a cara, juicio moral, monólogo</p></div><div class="card"><div class="num">04</div><div class="mini"><div class="frame"></div><div class="arrow">→</div></div><h3>Close-up + Zoom out</h3><p class="emotion">Soledad súbita</p><p class="use">Final triste, abandono, despedida</p></div><div class="card"><div class="num">05</div><div class="mini"><div class="frame"></div><div class="arrow">↻</div></div><h3>Close-up + Slow orbit</h3><p class="emotion">Examen íntimo</p><p class="use">Retrato, presentación profunda</p></div><div class="card"><div class="num">06</div><div class="mini"><div class="frame"></div><div class="arrow">⚡</div></div><h3>Medium shot + Dolly in</h3><p class="emotion">Conexión progresiva</p><p class="use">Conversación que se vuelve íntima</p></div><div class="card"><div class="num">07</div><div class="mini"><div class="frame"></div><div class="arrow">→</div></div><h3>Extreme close-up + Static</h3><p class="emotion">Peso simbólico del objeto</p><p class="use">Pista, símbolo, anillo, carta, herida</p></div><div class="card"><div class="num">08</div><div class="mini"><div class="frame"></div><div class="arrow">↻</div></div><h3>Extreme close-up + Push in</h3><p class="emotion">Misterio del objeto</p><p class="use">Algo va a pasar con ese objeto</p></div><div class="card"><div class="num">09</div><div class="mini"><div class="frame"></div><div class="arrow">⚡</div></div><h3>Extreme close-up + Tilt up</h3><p class="emotion">Descubrimiento progresivo</p><p class="use">Revelar objeto y contexto</p></div></div></foreignObject>
