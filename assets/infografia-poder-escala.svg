  <foreignObject x="92" y="510" width="1416" height="1570"><div xmlns="http://www.w3.org/1999/xhtml" style="display:grid;grid-template-columns:repeat(3,1fr);gap:24px;font-family:Arial,sans-serif;"><div class="card"><div class="num">01</div><div class="mini"><div class="frame"></div><div class="arrow">→</div></div><h3>Low angle + Tilt up</h3><p class="emotion">Monumentalidad creciente</p><p class="use">Héroe, villano, ídolo, jefe</p></div><div class="card"><div class="num">02</div><div class="mini"><div class="frame"></div><div class="arrow">↻</div></div><h3>Low angle + Hyper orbit</h3><p class="emotion">Presentación épica</p><p class="use">Entrada triunfal, drop musical, hero shot</p></div><div class="card"><div class="num">03</div><div class="mini"><div class="frame"></div><div class="arrow">⚡</div></div><h3>Low angle + Static</h3><p class="emotion">Dominio absoluto</p><p class="use">Antagonista, juicio, autoridad</p></div><div class="card"><div class="num">04</div><div class="mini"><div class="frame"></div><div class="arrow">→</div></div><h3>Low angle + Dolly in</h3><p class="emotion">Amenaza que se acerca</p><p class="use">Villano avanzando, presencia que crece</p></div><div class="card"><div class="num">05</div><div class="mini"><div class="frame"></div><div class="arrow">↻</div></div><h3>Extreme wide + Dolly out</h3><p class="emotion">Soledad que se expande</p><p class="use">Después de batalla, despedida</p></div><div class="card"><div class="num">06</div><div class="mini"><div class="frame"></div><div class="arrow">⚡</div></div><h3>Extreme wide + Crash zoom</h3><p class="emotion">Impacto visual distante</p><p class="use">Apertura épica, llegada a un lugar</p></div><div class="card"><div class="num">07</div><div class="mini"><div class="frame"></div><div class="arrow">→</div></div><h3>Extreme wide + Aerial</h3><p class="emotion">Geografía monumental</p><p class="use">Apertura, viaje, paisaje protagonista</p></div><div class="card"><div class="num">08</div><div 