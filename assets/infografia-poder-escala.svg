    <style>
      .bg{fill:#050607} .grid{stroke:#ffffff;stroke-opacity:.055;stroke-width:2} .kicker{font:900 34px Arial,sans-serif;letter-spacing:12px;fill:#8d5cff}
      .title{font:900 126px Arial,sans-serif;letter-spacing:-8px;fill:#f3f5f0} .sub{font:700 42px Arial,sans-serif;fill:#c8d0c8} .eq{font:900 40px Arial,sans-serif;fill:#f3f5f0;letter-spacing:4px}
      .card{background:rgba(255,255,255,.055);border:3px solid #8d5cff;border-radius:28px;color:#f3f5f0;padding:28px;box-sizing:border-box;height:500px;position:relative;overflow:hidden}
